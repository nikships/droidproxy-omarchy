name: Update CLIProxyAPI

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-cliproxyapi
  cancel-in-progress: true

jobs:
  update:
    name: Check & bump CLIProxyAPI
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          set -euo pipefail
          TAG=$(gh api repos/router-for-me/CLIProxyAPI/releases/latest --jq .tag_name)
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected upstream tag '$TAG'"; exit 1
          fi
          CURRENT=$(tr -d '[:space:]' < CLIPROXYAPI_VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $CURRENT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Bumping $CURRENT -> $VERSION"
          fi

      - name: Verify upstream binaries
        if: steps.upstream.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            scripts/fetch-cliproxyapi.sh "$arch" "/tmp/cpa-$arch" "$VERSION"
          done
          /tmp/cpa-amd64 -h 2>&1 | head -n 1 | grep -q "CLIProxyAPI Version: $VERSION"
          echo "$VERSION" > CLIPROXYAPI_VERSION

      - name: Create pull request
        if: steps.upstream.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(deps): bump CLIProxyAPI to ${{ steps.upstream.outputs.version }}'
          title: 'chore(deps): bump CLIProxyAPI to ${{ steps.upstream.outputs.version }}'
          body: |
            Updates bundled CLIProxyAPI to [${{ steps.upstream.outputs.version }}](https://github.com/router-for-me/CLIProxyAPI/releases/tag/${{ steps.upstream.outputs.tag }}).

            Both linux/amd64 and linux/arm64 archives were downloaded and verified against upstream `checksums.txt`.
            Merging this PR to `main` cuts a new DroidProxy release, and installed copies pick it up through the built-in updater.

            _Auto-generated by the Update CLIProxyAPI workflow._
          branch: bump-cliproxyapi-${{ steps.upstream.outputs.version }}
          delete-branch: true
